<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Resumen del Álbum</title>
        <link rel="preload" href="/COMPONENTES/header.html" as="fetch" crossorigin="anonymous">
        <link rel="preload" href="/COMPONENTES/footer.html" as="fetch" crossorigin="anonymous">
        <link rel="preload" href="/COMPONENTES/btnsub.html" as="fetch" crossorigin="anonymous">
        <link rel="stylesheet" href="../CSS/estilos_generales.css">
        <link rel="stylesheet" href="../CSS/resumen_del_album.css">
        <script src="/JAVASCRIPT/login.js" defer></script>
    </head>

    <body>
        <div id="header"></div>
        
        <main class="estadisticas">

            <h2> Estadísticas del Álbum</h2>

            <ul>
                <li>Figuritas obtenidas: <span id="obtenidas">0</span></li>
                <li>Figuritas faltantes: <span id="faltantes">0</span></li>
                <li>Porcentaje completado: <span id="porcentaje">0%</span></li>
                <li>Tipos de figuritas repetidas: <span id="tiposRepetidos">0</span></li>
                <li>Figuritas repetidas totales: <span id="repetidasTotales">0</span></li>
            </ul>

        </main>
        
        <div id="footer"></div>

        <div id="btnsub"></div>
        
        <script src="../JAVASCRIPT/estadisticas.js"></script>
        <script src="../JAVASCRIPT/encabezado.js"></script>

        <div id="auth-fondo">
            <div id="auth-caja" role="dialog" aria-modal="true" aria-label="Cuenta">
                <button id="auth-cerrar" type="button" aria-label="Cerrar">&times;</button>

                <div class="auth-tabs">
                    <button type="button" id="tab-login" class="activa">Iniciar sesión</button>
                    <button type="button" id="tab-registro">Registrarse</button>
                </div>

                <!-- Formulario de inicio de sesión -->
                <div id="form-login">
                    <label for="login-mail">Correo electrónico</label>
                    <input id="login-mail" type="text" autocomplete="off">
                    <label for="login-pass">Contraseña</label>
                    <input id="login-pass" type="password" autocomplete="off">
                    <button class="auth-enviar" type="button" id="login-enviar">Entrar</button>
                    <div class="auth-error" id="login-error"></div>
                </div>

                <!-- Formulario de registro -->
                <div id="form-registro" style="display:none">
                    <label for="reg-nombre">Nombre de usuario</label>
                    <input id="reg-nombre" type="text" autocomplete="off">
                    <label for="reg-mail">Correo electrónico</label>
                    <input id="reg-mail" type="text" autocomplete="off">
                    <label for="reg-pass">Contraseña (más de 8 caracteres)</label>
                    <input id="reg-pass" type="password" autocomplete="off">
                    <button class="auth-enviar" type="button" id="reg-enviar">Crear cuenta</button>
                    <div class="auth-error" id="reg-error"></div>
                </div>
            </div>
        </div>
    </body>
</html>
